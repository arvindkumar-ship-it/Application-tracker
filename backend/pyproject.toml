[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "redis>=5,<7", "celery[redis]>=5.4,<6",
  "itsdangerous>=2.2,<3", "playwright>=1.50,<2", "httpx>=0.28,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]
