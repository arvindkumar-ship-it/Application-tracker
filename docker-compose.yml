services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U portal -d portal]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["portal_data:/data"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery_app:celery worker --loglevel=info
    volumes: ["portal_data:/data"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery_app:celery beat --loglevel=info --schedule=/data/celerybeat-schedule
    volumes: ["portal_data:/data"]
    depends_on:
      redis: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  portal_data:
